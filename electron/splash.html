<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NRSA</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    font-family: 'Segoe UI', 'IBM Plex Sans', Arial, sans-serif;
  }

  .card {
    width: 560px;
    height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 30px 30px 24px;
    border-radius: 18px;
    background: radial-gradient(120% 140% at 50% 0%, #16213f 0%, #0b1220 60%, #060a15 100%);
    border: 1px solid rgba(120, 160, 255, 0.25);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.03) inset;
    position: relative;
    -webkit-app-region: drag;
  }

  .logo-wrap {
    margin-top: 6px;
    width: 168px;
    height: 168px;
    filter: drop-shadow(0 8px 24px rgba(30, 80, 200, 0.45));
    animation: fadeInDown 0.6s ease-out;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .name {
    margin-top: 14px;
    font-family: 'Oswald', 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 3px;
    color: #f3f6ff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    animation: fadeIn 0.8s ease-out;
  }

  .tagline {
    margin-top: 2px;
    font-size: 12.5px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #9db3e0;
    font-weight: 600;
    animation: fadeIn 1s ease-out;
  }

  .divider {
    width: 72px;
    height: 2px;
    margin: 14px 0 16px;
    background: linear-gradient(90deg, transparent, #c0392b, transparent);
  }

  .modules {
    display: flex;
    gap: 18px;
    color: #7f93bd;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    font-weight: 600;
    margin-bottom: auto;
  }
  .modules span { opacity: 0.85; }
  .modules span::before { content: '\25CF'; font-size: 5px; vertical-align: middle; margin-right: 5px; color: #4f8cff; }

  .progress-track {
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-top: 18px;
  }
  .progress-bar {
    width: 40%;
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #1f5fd1, #4fb0ff, #1f5fd1);
    animation: slide 1.35s ease-in-out infinite;
  }

  .status-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 11px;
    color: #7f93bd;
  }
  .status-text::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-120%); }
    50%  { transform: translateX(60%); }
    100% { transform: translateX(280%); }
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="../assets/logo.png" alt="NRSA" />
    </div>
    <div class="name">NRSA</div>
    <div class="tagline">Structural Design &amp; Analysis Software</div>
    <div class="divider"></div>
    <div class="modules">
      <span>RCC</span><span>STEEL</span><span>FOUNDATION</span><span>ANALYSIS</span><span>DRAWINGS</span>
    </div>
    <div class="progress-track"><div class="progress-bar"></div></div>
    <div class="status-row">
      <div class="status-text" id="statusText">Loading NRSA</div>
      <div id="versionText">v0.1.0</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const version = params.get('version');
    if (version) {
      document.getElementById('versionText').textContent = 'v' + version;
    }
  </script>
</body>
</html>
